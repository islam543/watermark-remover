[project]
name = "wmremove"
version = "0.1.0"
description = "Remove supported car-photo overlays from image links and local folders."
requires-python = ">=3.10,<3.12"
dependencies = ["iopaint>=1.4"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wmremove"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: loads the real LaMa model (downloads it on first run)"]
